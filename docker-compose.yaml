services:
  customer_backend:
    container_name: customer_backend
    build:
      context: .
      dockerfile: ./apps/backend/customer/Dockerfile
    restart: always
    ports:
      - 3001:3001
    networks:
      - app_network
    env_file:
      - .env
    healthcheck:
      test: curl -f localhost:3001/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
    # depends_on:
    # mysql:
    #   condition: service_healthy
    # redis:
    #   condition: service_healthy
  minio:
    image: minio/minio:latest
    ports:
      - ${MINIO_PORT}:${MINIO_PORT}
      - ${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}
    volumes:
      - ./minio/data:/export
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET}
      MINIO_API_PORT_NUMBER: ${MINIO_PORT}
      MINIO_CONSOLE_PORT_NUMBER: ${MINIO_CONSOLE_PORT}
    command:
      [
        "server",
        "/data",
        "--address",
        ":${MINIO_PORT}",
        "--console-address",
        ":${MINIO_CONSOLE_PORT}",
      ]
    networks:
      - app_network

networks:
  app_network:
    external: true
