name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/customer/**"
      - "packages/**"
      - ".github/workflows/prod.yml"

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        run: |
          echo "🚀 Triggering deployment for furever_home_backend..."
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "✅ Deploy webhook sent successfully!"
          else
            echo "❌ Deploy webhook failed with HTTP $http_code"
            exit 1
          fi

      - name: Deployment Summary
        if: success()
        run: |
          echo "### 🚀 Deployment Triggered Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`furever_home_backend\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Monitor deployment:** [Render Dashboard](https://dashboard.render.com)" >> $GITHUB_STEP_SUMMARY
